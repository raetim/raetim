<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@raemin2scence</title>

<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  @font-face {
    font-family: 'JejuStoneWall';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-EF@1.0/EF_jejudoldam.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  :root{
    --ink:#3B6479;
    --ink-soft:#3B6479;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; overscroll-behavior-y:none; background:#EAE5E2; height:100%; overflow:hidden;}
  body{
    margin:0;
    overscroll-behavior-y:none;
    height:100%;
    overflow:hidden;
    background:#EAE5E2;
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight:400;
    line-height:1.8;
  }

  .scroll-wrap{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:none;
    transform:translateZ(0);
    will-change:scroll-position;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  img{
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none;
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:60;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    padding:20px 6vw;
  }
  .menu-btn{
    width:44px;
    height:44px;
    border-radius:0;
    background:rgba(255,255,255,0.35);
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    position:relative;
    z-index:60;
  }
  .menu-btn span{
    width:18px;
    height:2px;
    background:var(--ink);
    border-radius:2px;
  }
  .menu-btn.open span:nth-child(1){ opacity:0; }
  .menu-btn.open span:nth-child(3){ opacity:0; }


  .menu-panel{
    position:fixed;
    inset:0;
    z-index:55;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6rem;
    background:rgba(255,255,255,0.17);
    backdrop-filter:blur(16px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .menu-panel.open{
    opacity:1;
    pointer-events:auto;
  }
  .menu-link{
    font-family:'JejuStoneWall', serif;
    font-size:1.05rem;
    font-weight:400;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .menu-link:hover{ opacity:0.6; }
  .menu-link.menu-raetim{ color:#DA8B8B; }

  /* ---------- HERO : 로고 + 소개글 (세로 배치) ---------- */
  .rs-hero{
    max-width:560px;
    margin:0 auto;
    padding:7rem 6vw 2rem;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:0.6rem;
  }
  .rs-logo{
    width:100%;
    max-width:460px;
    height:auto;
    display:block;
    margin:0 auto;
  }
  .rs-social{
    display:flex;
    justify-content:flex-end;
    gap:0.8rem;
  }
  .rs-social a{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(43,53,80,0.35);
    border-radius:50%;
  }
  .rs-social svg{ width:14px; height:14px; fill:var(--ink); }

  /* ---------- FOOTER (index.html과 동일) ---------- */
  footer{
    position:relative;
    z-index:1;
    padding:6rem 6vw 2.4rem;
    text-align:center;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.32) 65%, rgba(0,0,0,0.4) 100%);
  }
  .footer-logo{
    height:14px;
    width:auto;
    opacity:0.9;
  }

  

  /* ---------- SECTION COMMON ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:1rem 6vw 5rem;
  }
  section{ padding:1.5rem 0; }
  .section-title{
    font-family:'JejuStoneWall', serif;
    font-size:1.3rem;
    font-weight:400;
    letter-spacing:0.03em;
    margin:0 0 1.6rem;
    text-align:center;
    text-transform:uppercase;
  }

  /* ---------- NEWS 캐러셀 (index.html과 동일한 패턴) ---------- */
  .hscroll{
    display:flex;
    justify-content:center;
    gap:1.2rem;
    overflow-x:auto;
    padding:0.4rem 0.2rem 1.2rem;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .hscroll::-webkit-scrollbar{ display:none; }

  .carousel{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .carousel .hscroll{ flex:1; min-width:0; }
  .car-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--ink);
    font-size:2rem;
    line-height:1;
    padding:0 0.3rem;
    cursor:pointer;
  }
  .car-btn:disabled{ opacity:0.25; cursor:default; }
  .dashes{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:0.4rem;
  }
  .dashes .dash{
    width:18px;
    height:2px;
    background:rgba(43,53,80,0.25);
  }
  .dashes .dash.active{ background:var(--ink); }

  .gallery-item{
    flex:0 0 auto;
    width:min(640px, 100%);
    scroll-snap-align:start;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    color:inherit;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:rgba(43,53,80,0.06);
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-bg{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .thumb-gradient{
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
    pointer-events:none;
  }
  .thumb-cap{
    position:absolute;
    left:0; bottom:0;
    padding:0.7rem 0.9rem;
    text-align:left;
    z-index:2;
    display:flex;
    flex-direction:column;
  }
  .thumb-cap .thumb-date{
    font-size:0.68rem;
    color:#ffffff;
    opacity:0.7;
    margin-bottom:0.2rem;
  }
  .thumb-cap .thumb-title{
    font-size:1.05rem;
    font-weight:700;
    color:#ffffff;
  }
  .thumb-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    padding:1rem;
  }

  /* ---------- ARCHIVE : 2열 그리드 ---------- */
  .archive-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1rem 0.8rem;
  }
  .archive-item{
    display:block;
    background:none;
    border:none;
    padding:0;
    text-align:left;
    color:inherit;
    cursor:pointer;
  }

  @media (max-width:620px){
    .gallery-item{ width:100%; }
  }
</style>
</head>

<script>
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  function closeMenu() {
    menuPanel.classList.remove('open');
    menuBtn.classList.remove('open');
  }
  menuBtn.addEventListener('click', () => {
    const willOpen = !menuPanel.classList.contains('open');
    menuPanel.classList.toggle('open', willOpen);
    menuBtn.classList.toggle('open', willOpen);
  });
  document.querySelectorAll('.menu-link').forEach(link => {
    link.addEventListener('click', closeMenu);
  });
  menuPanel.addEventListener('click', (e) => {
    if (e.target === menuPanel) closeMenu();
  });

  document.querySelectorAll('.menu-raetim').forEach(function(link) {
    link.addEventListener('click', function(e) {
      if (window.opener) {
        e.preventDefault();
        window.close();
      }
    });
  });

  function initCarousel(scrollId, dashesId) {
    const scroll = document.getElementById(scrollId);
    const dashesWrap = document.getElementById(dashesId);
    if (!scroll) return;
    const items = scroll.querySelectorAll('.gallery-item');
    const prevBtn = document.querySelector('.car-btn.prev[data-target="' + scrollId + '"]');
    const nextBtn = document.querySelector('.car-btn.next[data-target="' + scrollId + '"]');

    if (items.length === 0) {
      if (prevBtn) prevBtn.style.display = 'none';
      if (nextBtn) nextBtn.style.display = 'none';
      return;
    }

    items.forEach((_, i) => {
      const dash = document.createElement('span');
      dash.className = 'dash' + (i === 0 ? ' active' : '');
      dashesWrap.appendChild(dash);
    });
    const dashes = dashesWrap.querySelectorAll('.dash');

    function step() {
      const item = items[0];
      const style = getComputedStyle(scroll);
      const gap = parseFloat(style.columnGap || style.gap || '0');
      return item.getBoundingClientRect().width + gap;
    }

    function updateButtons() {
      const maxScroll = scroll.scrollWidth - scroll.clientWidth - 2;
      if (prevBtn) prevBtn.disabled = scroll.scrollLeft <= 2;
      if (nextBtn) nextBtn.disabled = scroll.scrollLeft >= maxScroll;
    }

    function updateDashes() {
      const s = step();
      const idx = s > 0 ? Math.round(scroll.scrollLeft / s) : 0;
      dashes.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    if (prevBtn) prevBtn.addEventListener('click', () => scroll.scrollBy({ left: -step(), behavior: 'smooth' }));
    if (nextBtn) nextBtn.addEventListener('click', () => scroll.scrollBy({ left: step(), behavior: 'smooth' }));

    scroll.addEventListener('scroll', () => {
      updateButtons();
      updateDashes();
    });

    updateButtons();
    updateDashes();
  }

  initCarousel('rsWorksScroll', 'rsWorksDashes');
</script>
