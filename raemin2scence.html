<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@raemin2scence</title>

<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  @font-face {
    font-family: 'BookkMyungjo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'BookkMyungjo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root{
    --ink:#2B3550;
    --ink-soft:#5B647F;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:#EAE5E2;
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight:400;
    line-height:1.8;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  img{
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    user-drag:none;
    pointer-events:auto;
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px 6vw;
  }
  .menu-btn{
    width:44px;
    height:44px;
    border-radius:0;
    background:rgba(255,255,255,0.35);
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    position:relative;
    z-index:60;
  }
  .menu-btn span{
    width:18px;
    height:2px;
    background:var(--ink);
    border-radius:2px;
  }
  .menu-btn .menu-btn-x{
    display:none;
    font-size:24px;
    line-height:1;
    color:var(--ink);
    font-weight:300;
  }
  .menu-btn.open span{ display:none; }
  .menu-btn.open .menu-btn-x{ display:block; }

  .menu-panel{
    position:fixed;
    inset:0;
    z-index:55;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6rem;
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(16px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .menu-panel.open{
    opacity:1;
    pointer-events:auto;
  }
  .menu-link{
    font-family:'BookkMyungjo', serif;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .menu-link:hover{ opacity:0.6; }

  /* ---------- HERO : 로고 + 소개글 (세로 배치) ---------- */
  .rs-hero{
    max-width:640px;
    margin:0 auto;
    padding:9rem 6vw 3rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:1.4rem;
  }
  .rs-logo-slot{
    width:150px;
    height:150px;
    border:1px dashed rgba(43,53,80,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    padding:1rem;
  }
  /* 로고 이미지가 정해지면 위 .rs-logo-slot 자리에 <img src="images/raemin2scence-logo.png"> 를 넣어주세요 */
  .rs-tagline{
    font-size:0.8rem;
    color:var(--ink);
    margin:0;
  }

  /* ---------- SECTION COMMON ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:1rem 6vw 5rem;
  }
  section{ padding:1.5rem 0; }
  .section-title{
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.03em;
    margin:0 0 1.6rem;
    text-align:center;
    text-transform:uppercase;
  }

  /* ---------- NEWS 캐러셀 (index.html과 동일한 패턴) ---------- */
  .hscroll{
    display:flex;
    justify-content:center;
    gap:1.2rem;
    overflow-x:auto;
    padding:0.4rem 0.2rem 1.2rem;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .hscroll::-webkit-scrollbar{ display:none; }

  .carousel{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .carousel .hscroll{ flex:1; min-width:0; }
  .car-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--ink);
    font-size:2rem;
    line-height:1;
    padding:0 0.3rem;
    cursor:pointer;
  }
  .car-btn:disabled{ opacity:0.25; cursor:default; }
  .dashes{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:0.4rem;
  }
  .dashes .dash{
    width:18px;
    height:2px;
    background:rgba(43,53,80,0.25);
  }
  .dashes .dash.active{ background:var(--ink); }

  .gallery-item{
    flex:0 0 auto;
    width:min(640px, 82vw);
    scroll-snap-align:start;
    background:none;
    border:none;
    padding:0;
    cursor:default;
    text-align:left;
    color:inherit;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:rgba(43,53,80,0.06);
    border:1px dashed rgba(43,53,80,0.3);
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-gradient{
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
    pointer-events:none;
  }
  .thumb-cap{
    position:absolute;
    left:0; bottom:0;
    padding:0.7rem 0.9rem;
    text-align:left;
    z-index:2;
    display:flex;
    flex-direction:column;
  }
  .thumb-cap .thumb-date{
    font-size:0.68rem;
    color:#ffffff;
    opacity:0.7;
    margin-bottom:0.2rem;
  }
  .thumb-cap .thumb-title{
    font-size:1.05rem;
    font-weight:700;
    color:#ffffff;
  }
  .thumb-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    padding:1rem;
  }

  @media (max-width:620px){
    .gallery-item{ width:88vw; }
    .rs-logo-slot{ width:130px; height:130px; }
  }
</style>
</head>
<body>

<nav id="siteNav">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
    <span></span><span></span><span></span>
    <span class="menu-btn-x">&times;</span>
  </button>
</nav>

<div class="menu-panel" id="menuPanel">
  <a href="#rs-profile" class="menu-link">profile</a>
  <a href="mv.html" class="menu-link">mv</a>
  <a href="illust.html" class="menu-link">illust</a>
  <a href="index.html" class="menu-link">@raetim</a>
</div>

<!-- ============ HERO : 로고 + 소개글 ============ -->
<header class="rs-hero" id="rs-profile">
  <div class="rs-logo-slot">
    로고 이미지를<br>이 자리에 삽입해주세요
  </div>
  <!-- TODO : 아래 소개 문구는 필요하면 수정해주세요 -->
  <p class="rs-tagline">
    태림(raetim)의 은밀한 일러스트 계정.<br>
    바라보고 싶은 것을 표현하고 있어요
  </p>
</header>

<main>
  <!-- ============ NEWS (index.html과 동일한 캐러셀 형식) ============ -->
  <section id="rs-news">
    <h2 class="section-title">news</h2>
    <div class="carousel">
      <button class="car-btn prev" data-target="rsNewsScroll" aria-label="이전">&#8249;</button>
      <div class="hscroll" id="rsNewsScroll">
        <!-- TODO : 실제 소식으로 교체해주세요. index.html의 news와 동일한 형식입니다 -->
        <button class="gallery-item" data-title="??" data-date="20XX.XX">
          <div class="thumb">
            <div class="thumb-placeholder">이미지 삽입 (16:9)</div>
            <div class="thumb-gradient"></div>
            <div class="thumb-cap">
              <span class="thumb-date">20XX.XX</span>
              <span class="thumb-title">??</span>
            </div>
          </div>
        </button>
      </div>
      <button class="car-btn next" data-target="rsNewsScroll" aria-label="다음">&#8250;</button>
    </div>
    <div class="dashes" id="rsNewsDashes"></div>
  </section>
</main>

<script>
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  function closeMenu() {
    menuPanel.classList.remove('open');
    menuBtn.classList.remove('open');
  }
  menuBtn.addEventListener('click', () => {
    const willOpen = !menuPanel.classList.contains('open');
    menuPanel.classList.toggle('open', willOpen);
    menuBtn.classList.toggle('open', willOpen);
  });
  document.querySelectorAll('.menu-link').forEach(link => {
    link.addEventListener('click', closeMenu);
  });
  menuPanel.addEventListener('click', (e) => {
    if (e.target === menuPanel) closeMenu();
  });

  function initCarousel(scrollId, dashesId) {
    const scroll = document.getElementById(scrollId);
    const dashesWrap = document.getElementById(dashesId);
    if (!scroll) return;
    const items = scroll.querySelectorAll('.gallery-item');
    const prevBtn = document.querySelector('.car-btn.prev[data-target="' + scrollId + '"]');
    const nextBtn = document.querySelector('.car-btn.next[data-target="' + scrollId + '"]');

    if (items.length === 0) {
      if (prevBtn) prevBtn.style.display = 'none';
      if (nextBtn) nextBtn.style.display = 'none';
      return;
    }

    items.forEach((_, i) => {
      const dash = document.createElement('span');
      dash.className = 'dash' + (i === 0 ? ' active' : '');
      dashesWrap.appendChild(dash);
    });
    const dashes = dashesWrap.querySelectorAll('.dash');

    function step() {
      const item = items[0];
      const style = getComputedStyle(scroll);
      const gap = parseFloat(style.columnGap || style.gap || '0');
      return item.getBoundingClientRect().width + gap;
    }

    function updateButtons() {
      const maxScroll = scroll.scrollWidth - scroll.clientWidth - 2;
      if (prevBtn) prevBtn.disabled = scroll.scrollLeft <= 2;
      if (nextBtn) nextBtn.disabled = scroll.scrollLeft >= maxScroll;
    }

    function updateDashes() {
      const s = step();
      const idx = s > 0 ? Math.round(scroll.scrollLeft / s) : 0;
      dashes.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    if (prevBtn) prevBtn.addEventListener('click', () => scroll.scrollBy({ left: -step(), behavior: 'smooth' }));
    if (nextBtn) nextBtn.addEventListener('click', () => scroll.scrollBy({ left: step(), behavior: 'smooth' }));

    scroll.addEventListener('scroll', () => {
      updateButtons();
      updateDashes();
    });

    updateButtons();
    updateDashes();
  }

  initCarousel('rsNewsScroll', 'rsNewsDashes');
</script>

</body>
</html>
