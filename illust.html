<style>
  @font-face {
    font-family: 'BookkMyungjo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'BookkMyungjo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root{
    --ink:#2B3550;
    --ink-soft:#5B647F;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; overscroll-behavior-y:none; background:#EAE5E2; height:100%; overflow:hidden;}
  body{
    margin:0;
    overscroll-behavior-y:none;
    height:100%;
    overflow:hidden;
    background:#EAE5E2;
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight:400;
    line-height:1.8;
  }

  .scroll-wrap{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:none;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  img{
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    user-drag:none;
    -webkit-touch-callout:none;
    pointer-events:none;
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:60;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    padding:20px 6vw;
  }
  .menu-btn{
    width:44px;
    height:44px;
    border-radius:0;
    background:rgba(255,255,255,0.35);
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    position:relative;
    z-index:60;
  }
  .menu-btn span{
    width:18px;
    height:2px;
    background:var(--ink);
    border-radius:2px;
  }
  .menu-btn.open span:nth-child(1){ opacity:0; }
  .menu-btn.open span:nth-child(3){ opacity:0; }


  .menu-panel{
    position:fixed;
    inset:0;
    z-index:55;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6rem;
    background:rgba(255,255,255,0.17);
    backdrop-filter:blur(16px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .menu-panel.open{
    opacity:1;
    pointer-events:auto;
  }
  .menu-link{
    font-family:'BookkMyungjo', serif;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .menu-link:hover{ opacity:0.6; }

  /* ---------- SECTION COMMON ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:9rem 6vw 5rem;
  }
  .section-title{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:0.03em;
    margin:0 0 2rem;
    text-align:center;
    text-transform:uppercase;
  }

  /* ---------- 2열 아카이브 갤러리 ---------- */
  .archive-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1rem 0.8rem;
  }
  .archive-item{
    display:block;
    background:none;
    border:none;
    padding:0;
    text-align:left;
    color:inherit;
    cursor:pointer;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:rgba(43,53,80,0.06);
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-bg{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .thumb-gradient{
    position:absolute;
    left:0; right:0; bottom:0;
    height:50%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
    pointer-events:none;
  }
  .thumb-cap{
    position:absolute;
    left:0; bottom:0;
    padding:0.55rem 0.7rem;
    text-align:left;
    z-index:2;
    display:flex;
    flex-direction:column;
  }
  .thumb-cap .thumb-date{
    font-size:0.6rem;
    color:#ffffff;
    opacity:0.7;
    margin-bottom:0.15rem;
  }
  .thumb-cap .thumb-title{
    font-size:0.85rem;
    font-weight:700;
    color:#ffffff;
  }
  .thumb-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.7rem;
    color:var(--ink-soft);
    padding:0.6rem;
  }

  /* ---------- FOOTER (index.html과 동일) ---------- */
  footer{
    position:relative;
    z-index:1;
    padding:6rem 6vw 2.4rem;
    text-align:center;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.32) 65%, rgba(0,0,0,0.4) 100%);
  }
  .footer-logo{
    height:14px;
    width:auto;
    opacity:0.9;
  }

  @media (max-width:480px){
    .archive-grid{ gap:0.6rem; }
  }
</style>

<script>
  (function() {
    var el = document.querySelector('.scroll-wrap');
    if (!el) return;
    var startY = 0;
    el.addEventListener('touchstart', function(e) {
      startY = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchmove', function(e) {
      var y = e.touches[0].clientY;
      var deltaY = y - startY;
      var atTop = el.scrollTop <= 0;
      var atBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 1;
      if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
        e.preventDefault();
      }
    }, { passive: false });
  })();

  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  function closeMenu() {
    menuPanel.classList.remove('open');
    menuBtn.classList.remove('open');
  }
  menuBtn.addEventListener('click', () => {
    const willOpen = !menuPanel.classList.contains('open');
    menuPanel.classList.toggle('open', willOpen);
    menuBtn.classList.toggle('open', willOpen);
  });
  document.querySelectorAll('.menu-link').forEach(link => {
    link.addEventListener('click', closeMenu);
  });
  menuPanel.addEventListener('click', (e) => {
    if (e.target === menuPanel) closeMenu();
  });
</script>
