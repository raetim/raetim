  .sky-bg-note{
    position:fixed;
    inset:0;
    z-index:-1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 2rem;
    color:rgba(43,53,80,0.4);
    font-size:0.85rem;
    pointer-events:none;
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px 6vw;
  }
  .menu-btn{
    width:44px;
    height:44px;
    border-radius:0;
    background:rgba(255,255,255,0.32);
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
  }
  .menu-btn span{
    width:18px;
    height:2px;
    background:var(--ink);
    border-radius:2px;
  }

  .menu-panel{
    position:fixed;
    top:64px;
    right:6vw;
    z-index:49;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(10px);
    border-radius:0;
    padding:0.6rem;
    min-width:180px;
    opacity:0;
    transform:translateY(-8px);
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .menu-panel.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .menu-link{
    padding:0.7rem 0.9rem;
    font-size:0.9rem;
    letter-spacing:0.02em;
    border-radius:0;
    color:var(--ink);
  }
  .menu-link:hover{ background:rgba(43,53,80,0.08); }
  .menu-link.menu-raemin{ color:#FFF3B0; }

  /* ---------- HERO (로고 삽입 자리) ---------- */
  .hero{
    position:relative;
    height:38vh;
    min-height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-slot{
    width:220px;
    height:220px;
    border:1px dashed rgba(255,255,255,0.6);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.85rem;
    color:rgba(255,255,255,0.85);
    padding:1rem;
  }
  .logo-img{
    width:560px;
    max-width:85vw;
    height:auto;
    display:block;
  }

  /* ---------- SECTION COMMON ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:0 6vw 4rem;
    position:relative;
    z-index:1;
  }
  section{ padding:2rem 0 3.5rem; }
  .section-title{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:0.03em;
    margin:0 0 1.6rem;
    text-align:center;
  }

  /* ---------- HORIZONTAL SCROLL GALLERY (news / discography 공용) ---------- */
  .hscroll{
    display:flex;
    justify-content:center;
    gap:1.2rem;
    overflow-x:auto;
    padding:0.4rem 0.2rem 1.2rem;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .hscroll::-webkit-scrollbar{ display:none; }

  .carousel{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .carousel .hscroll{ flex:1; min-width:0; }
  .car-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:#ffffff;
    font-size:2rem;
    line-height:1;
    padding:0 0.3rem;
    cursor:pointer;
  }
  .car-btn:disabled{
    opacity:0.25;
    cursor:default;
  }
  .dashes{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:0.4rem;
  }
  .dashes .dash{
    width:18px;
    height:2px;
    background:rgba(255,255,255,0.35);
  }
  .dashes .dash.active{ background:#ffffff; }

  .gallery-item{
    flex:0 0 auto;
    width:min(640px, 82vw);
    scroll-snap-align:start;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    color:inherit;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:0;
    background:rgba(255,255,255,0.55);
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-gradient{
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
    pointer-events:none;
  }
  .thumb-cap{
    position:absolute;
    left:0; bottom:0;
    padding:0.7rem 0.9rem;
    text-align:left;
    z-index:2;
    display:flex;
    flex-direction:column;
  }
  .thumb-cap .thumb-date{
    font-size:0.68rem;
    color:#ffffff;
    opacity:0.5;
    margin-bottom:0.2rem;
  }
  .thumb-cap .thumb-title{
    font-size:1.1rem;
    font-weight:700;
    color:#ffffff;
  }

  /* ---------- FOOTER ---------- */
  footer{
    position:relative;
    z-index:1;

<script>
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  menuBtn.addEventListener('click', () => menuPanel.classList.toggle('open'));
  document.querySelectorAll('.menu-link').forEach(link => {
    link.addEventListener('click', () => menuPanel.classList.remove('open'));
  });
  document.addEventListener('click', (e) => {
    if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.classList.remove('open');
    }
  });

  // 뉴스 / 디스코그래피 캐러셀: 화살표 버튼 + 하단 인디케이터
  function initCarousel(scrollId, dashesId) {
    const scroll = document.getElementById(scrollId);
    const dashesWrap = document.getElementById(dashesId);
    if (!scroll) return;
    const items = scroll.querySelectorAll('.gallery-item');
    const prevBtn = document.querySelector('.car-btn.prev[data-target="' + scrollId + '"]');
    const nextBtn = document.querySelector('.car-btn.next[data-target="' + scrollId + '"]');

    if (items.length === 0) {
      if (prevBtn) prevBtn.style.display = 'none';
      if (nextBtn) nextBtn.style.display = 'none';
      return;
    }

    items.forEach((_, i) => {
      const dash = document.createElement('span');
      dash.className = 'dash' + (i === 0 ? ' active' : '');
      dashesWrap.appendChild(dash);
    });
    const dashes = dashesWrap.querySelectorAll('.dash');

    function step() {
      const item = items[0];
      const style = getComputedStyle(scroll);
      const gap = parseFloat(style.columnGap || style.gap || '0');
      return item.getBoundingClientRect().width + gap;
    }

    function updateButtons() {
      const maxScroll = scroll.scrollWidth - scroll.clientWidth - 2;
      if (prevBtn) prevBtn.disabled = scroll.scrollLeft <= 2;
      if (nextBtn) nextBtn.disabled = scroll.scrollLeft >= maxScroll;
    }

    function updateDashes() {
      const s = step();
      const idx = s > 0 ? Math.round(scroll.scrollLeft / s) : 0;
      dashes.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    if (prevBtn) prevBtn.addEventListener('click', () => scroll.scrollBy({ left: -step(), behavior: 'smooth' }));
    if (nextBtn) nextBtn.addEventListener('click', () => scroll.scrollBy({ left: step(), behavior: 'smooth' }));

    scroll.addEventListener('scroll', () => {
      updateButtons();
      updateDashes();
    });

    updateButtons();
    updateDashes();
  }

  initCarousel('newsScroll', 'newsDashes');
  initCarousel('discoScroll', 'discoDashes');
</script>
